name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke check
        run: |
          set -e
          test -f index.html || test -f public/index.html
          # no secrets in tracked files
          if git grep -nE 'sk_live_|sk_test_[A-Za-z0-9]{20,}|BEGIN (RSA |OPENSSH )?PRIVATE KEY' -- . ':(exclude)*.md' 2>/dev/null; then
            echo "Possible secret found in repo"
            exit 1
          fi
          echo "OK"
      - name: Health file
        run: test -f health.json || test -f public/health.json
