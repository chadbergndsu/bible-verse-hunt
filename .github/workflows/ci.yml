name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Smoke check
        run: |
          set -euo pipefail
          if [ -f index.html ] || [ -f public/index.html ]; then
            echo "index.html present"
          else
            echo "missing index.html"
            exit 1
          fi
          # Secret scan excludes workflow/docs (pattern text lives in CI yml)
          if git grep -nE "sk_live_[A-Za-z0-9]+|sk_test_[A-Za-z0-9]{20,}|BEGIN RSA PRIVATE KEY|BEGIN OPENSSH PRIVATE KEY|BEGIN PRIVATE KEY" \
            -- . \
            ":(exclude)*.md" \
            ":(exclude).github/**" \
            ":(exclude)*.yml" \
            ":(exclude)*.yaml" \
            2>/dev/null; then
            echo "Possible secret found in repo"
            exit 1
          fi
          echo "OK"
      - name: Health file
        run: test -f health.json || test -f public/health.json

